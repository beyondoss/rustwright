# Shared Rustwright files mirrored from rustwright to rustwright-cloud.
# Repository-specific GitHub workflows and metadata are intentionally excluded.
# Cloud-only additions must live outside the mirrored paths below.
Skyvern-AI/rustwright-cloud:
  - source: benchmarks/
    dest: benchmarks/
    deleteOrphaned: true
  # The native agent CLI (cli/) and the native MCP server (mcp/) are
  # standalone Cargo workspaces developed in both repos; they are mapped here
  # so external contributions back-sync to the cloud repo like the rest of the
  # shared tree. Both directories must exist on this repo's main before these
  # entries (deleteOrphaned would otherwise propagate their absence).
  - source: cli/
    dest: cli/
    deleteOrphaned: true
  - source: mcp/
    dest: mcp/
    deleteOrphaned: true
  # rust-native/ and agent/ are Cargo workspace members referenced by the
  # synced root Cargo.toml; they must mirror together or the target repo's
  # workspace breaks.
  - source: rust-native/
    dest: rust-native/
    deleteOrphaned: true
  - source: agent/
    dest: agent/
    deleteOrphaned: true
  - source: docs/
    dest: docs/
    deleteOrphaned: true
  - source: src/
    dest: src/
    deleteOrphaned: true
  - source: tests/
    dest: tests/
    deleteOrphaned: true
  - source: tools/
    dest: tools/
    deleteOrphaned: true
  - source: .dockerignore
    dest: .dockerignore
  - source: .gitignore
    dest: .gitignore
  - source: BENCHMARK.md
    dest: BENCHMARK.md
  - source: CODE_ARCHITECTURE.md
    dest: CODE_ARCHITECTURE.md
  - source: CODE_OF_CONDUCT.md
    dest: CODE_OF_CONDUCT.md
  - source: CONTRIBUTING.md
    dest: CONTRIBUTING.md
  - source: Cargo.lock
    dest: Cargo.lock
  - source: Cargo.toml
    dest: Cargo.toml
  - source: Dockerfile
    dest: Dockerfile
  - source: LICENSE
    dest: LICENSE
  - source: LIMITATIONS.md
    dest: LIMITATIONS.md
  - source: README.md
    dest: README.md
  - source: SECURITY.md
    dest: SECURITY.md
  - source: QUICKSTART.md
    dest: QUICKSTART.md
  - source: MEMORY_BENCH.md
    dest: MEMORY_BENCH.md
