[package]
name = "rustwright-core"
version = "0.3.3"
edition = "2021"
rust-version = "1.85"
description = "Rust CDP core for Rustwright CLI and MCP browser automation"
license = "MIT"
repository = "https://github.com/beyondoss/rustwright"
homepage = "https://github.com/beyondoss/rustwright"
readme = "README.md"
keywords = ["browser", "automation", "cdp", "mcp", "chromium"]
categories = ["web-programming"]

[workspace]
members = ["rust-native", "agent"]
resolver = "2"

[features]
default = []
# Native connection probes, local CA injection, and internal runtime-state
# probes for explicit test builds only.
# Default and release builds must not enable this feature.
test-support = [
    "dep:rustls",
    "dep:rustls-pki-types",
    "dep:webpki-roots",
]

[lib]
name = "rustwright_core"
crate-type = ["rlib"]

[dependencies]
base64 = "0.22.1"
futures-util = "0.3.31"
image = { version = "0.25.6", default-features = false, features = ["gif", "jpeg"] }
oxideav-vp8 = { version = "0.1", default-features = false }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.194", features = ["derive"] }
serde_json = "1.0.127"
libc = "0.2.186"
tempfile = "3.8.1"
thiserror = "2"
rustls = { version = "0.23.41", default-features = false, features = ["ring", "std"], optional = true }
rustls-pki-types = { version = "1.15.0", optional = true }
tokio = { version = "1.52.3", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
webpki-roots = { version = "0.26.11", optional = true }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("python"))'] }
